# @TheTechMargin 2026
# Синхронизация миграций БД с Supabase при пуше в main.
# Использует Management API (нужен только токен, пароль БД не требуется).
#
# Требуются репозиторные секреты (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN — PAT с supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF  — ref проекта, напр. hgcxrxgobmfgolmbsglw
#
# Без секретов шаг аккуратно пропускается, CI не ломается.
name: Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch: {}

jobs:
  db:
    name: Применить миграции
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Применить недостающие миграции
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Секреты SUPABASE_ACCESS_TOKEN/SUPABASE_PROJECT_REF не заданы — пропускаем."
            exit 0
          fi
          API="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}"

          # Версии, уже применённые в БД (таблица ведётся самим CLI)
          APPLIED=$(curl -s -X POST \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"query":"select version from supabase_migrations.schema_migrations"}' \
            "${API}/database/query")

          for f in supabase/migrations/*.sql; do
            base=$(basename "$f")
            v=$(echo "$base" | cut -d_ -f1)
            if echo "$APPLIED" | grep -q "\"version\":\"$v\""; then
              echo "✓ $base уже применена — пропуск"
              continue
            fi
            echo "→ применяю $base"
            resp=$(curl -s -w "\n%{http_code}" -X POST \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary "$(jq -Rs '{query: .}' < "$f")" \
              "${API}/database/query")
            code=$(echo "$resp" | tail -n1)
            if [ "$code" != "201" ]; then
              echo "$resp"
              exit 1
            fi
            # Фиксируем версию, чтобы следующие прогоны её не повторяли
            curl -s -X POST \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary "$(jq -Rs --arg v "$v" --arg n "${base%.sql}" \
                '{query: ("insert into supabase_migrations.schema_migrations (version, statements, name, created_by) values (\x27" + $v + "\x27, to_jsonb(array[\x27" + . + "\x27]), \x27" + $n + "\x27, \x27github-actions\x27) on conflict (version) do nothing;")}' )" \
              "${API}/database/query" > /dev/null
            echo "  зафиксирована версия $v"
          done
          echo "Готово. Применённые версии в БД:"
          echo "$APPLIED" | grep -o '"version":"[^"]*"' | cut -d'"' -f4 | sort -u | tr '\n' ' '
          echo
