# @TheTechMargin 2026
# Создание/обновление учётной записи super_admin из зашифрованных секретов
# репозитория. Запускается вручную (workflow_dispatch), пароль живёт только
# в секрете и в виде argon2id-хеша в БД — в репозиторий и логи не попадает.
#
# Секреты: SUPER_ADMIN_EMAIL, SUPER_ADMIN_PASSWORD (созданы через API),
#          SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF (для Management API).
name: Create super admin

on:
  workflow_dispatch: {}

jobs:
  create:
    name: Создать super_admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости (нужен argon2)
        run: npm ci

      - name: Создать super_admin
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL }}
          SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN/SUPABASE_PROJECT_REF не заданы — пропускаю."; exit 0
          fi
          if [ -z "${SUPER_ADMIN_EMAIL:-}" ] || [ -z "${SUPER_ADMIN_PASSWORD:-}" ]; then
            echo "SUPER_ADMIN_EMAIL/SUPER_ADMIN_PASSWORD не заданы — пропускаю."; exit 0
          fi
          echo "Проект Supabase: ${SUPABASE_PROJECT_REF}"
          API="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}"

          # argon2id-хеш считается здесь же — открытый текст пароля в SQL не идёт.
          HASH=$(node -e '
            const { hash } = require("@node-rs/argon2");
            hash(process.env.SUPER_ADMIN_PASSWORD).then((h) => process.stdout.write(h));
          ')
          EMAIL=$(printf '%s' "$SUPER_ADMIN_EMAIL" | tr '[:upper:]' '[:lower:]')

          # Уже существует — обновляем пароль/роль и реактивируем (upsert).
          # Вставка идёт только захешированным паролем; в SQL-текст попадают
          # email (проверен на @) и argon2id-хеш (base64url, без кавычек).
          SQL="insert into admin_users (email, password_hash, role, is_active, last_login_at)
               values ('${EMAIL}', '${HASH}', 'super_admin', true, now())
               on conflict (email) do update
                 set password_hash = excluded.password_hash,
                     role = 'super_admin',
                     is_active = true"
          resp=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary "$(jq -n --arg q "$SQL" '{query: $q}')" \
            "${API}/database/query")
          code=$(echo "$resp" | tail -n1)
          if [ "$code" != "201" ] && [ "$code" != "200" ]; then
            echo "$resp"; exit 1
          fi
          echo "✓ super_admin ${EMAIL} создан/обновлён."
